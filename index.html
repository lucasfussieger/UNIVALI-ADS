<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVALI Lucas - Atividades</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 2px solid #000000;
        }

        .header {
            background-color: #000000;
            color: #ffffff;
            padding: 50px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .content {
            padding: 50px 40px;
        }

        .content h2 {
            color: #000000;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.8rem;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .link-card {
            background-color: #f5f5f5;
            border: 2px solid #000000;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .link-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            background-color: #e0e0e0;
        }

        .link-card a {
            display: block;
            padding: 40px 20px;
            color: #000000;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        .link-card .title {
            font-size: 1.4rem;
            font-weight: 700;
            display: block;
        }

        .footer {
            background-color: #f5f5f5;
            padding: 20px;
            text-align: center;
            color: #333333;
            font-size: 0.9rem;
            border-top: 2px solid #000000;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2rem;
            }

            .content {
                padding: 30px 20px;
            }

            .links-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>UNIVALI</h1>
            <p>Atividades 2026</p>
        </header>

        <main class="content">
            <h2>Atividades</h2>

            <div class="links-grid">
                <div class="link-card">
                    <a href="AULA01/mimis.html">
                        <span class="title">Atividade 1</span>
                    </a>
                </div>

                <div class="link-card">
                    <a href="AULA02/carta.html">
                        <span class="title">Atividade 2</span>
                    </a>
                </div>

                <div class="link-card">
                    <a href="AULA03/index.html">
                        <span class="title">Atividade 3</span>
                    </a>
                </div>

                <div class="link-card">
                    <a href="AULA04/index.html">
                        <span class="title">Atividade 4</span>
                    </a>
                </div>
            </div>
        </main>

        <footer class="footer">
            Página criada como atividade da UNIVALI · 2026
        </footer>
    </div>
</body>
</html>
